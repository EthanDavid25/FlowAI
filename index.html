<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 
      Content-Security-Policy — renderer is locked down:
      - No inline scripts (hash is added by Vite at build time)
      - Scripts only from the app's own origin
      - No connections to external resources yet
      - Images from self only (data: URIs allowed for preview panel)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        connect-src 'self';
        font-src 'self' data:;
      "
    />
    <title>FlowAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
